name: miEPG

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Comprobar e instalar xml tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Dar permisos de ejecución al script
        run: |
          chmod +x .github/workflows/EPG_script.sh

      - name: Ejecutar script
        run: |
          .github/workflows/EPG_script.sh

      - name: Configurar identidad de Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Subir archivos
        run: |
          git add .
          git commit -m "Actualizar miEPG.xml" || echo "No hay cambios para subir"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
